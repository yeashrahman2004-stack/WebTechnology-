        <title>Admin Registration Form </title>
</head>



<body>

    <header> 

        <h1> Admin Information </h1>
    
    </header>

    <form method = "GET">

    <fieldset>

        <legend> Personal Information </legend><br>

        <label> Name : </label><br>
        <input type = "text" Name = "name" id=""Name" placeholder = "Enter your Name"> <br> <br>

        <label> Email : </label><br>
        <input type = "email" Name = "Email" id=""Email" placeholder = "Enter your Email"> <br> <br>

        <label> Phone : </label><br>
        <input type = "tel" Name = "phone" id="phone" placeholder = "Enter your Phone Number"> <br> <br>

        <label> Age: </label><br>
        <input type = "number" Name = "age" id="age" max="120" min="0"><br> <br>

        <label> Gender : </label>
        <input type = "radio" Name = "Gender" value ="Male"> Male
        <input type = "radio" Name = "Gender" value ="Female"> Female  <br> <br>

    </fieldset><br>



     <fieldset>

        <legend> University Information</legend><br>

        <label> University ID: </label><br>
        <input type = "id" Name = "uni_id" id="uni_id" placeholder = "Enter your 4 digit university id"><br><br>

        <label> Department : </label>
        <select id = "dept">
        <option value = "select"> Select </option>
        <option value = "CSE"> CSE</option>
        <option value = "EEE"> EEE</option>
        <option value = "BBA"> BBA</option>
        <option value = "LAW"> LAW</option>
        </select> <br> <br>


        <label> Role: </label>
        <select id = "role">
        <option value = "select"> Select </option>
        <option value = "Student"> Student</option>
        <option value = "Faculty"> Faculty</option>
        <option value = "Authority"> Authority</option>
        </select> <br> <br>

 
    </fieldset><br>


    <fieldset>

        <legend> Account Information </legend><br>

            
    
        <label> Password : </label><br>
        <input type = "password" Name = "password" id="password" placeholder = "Minimum 6 Characters"> <br> <br>

        <label> Confirm Password : </label><br>
        <input type = "password" Name = "confirm_password" id="confirm_password" placeholder = " Re-enter password" <br>

    </fieldset> <br>




    <fieldset>

        <legend> Admin Verification </legend><br>

        <label> Admin ID: </label><br>
        <input type = "id" Name = "admin_id" id="admin_id" placeholder = "Enter your 4 digit admin id"><br><br>

        <input type = "checkbox" id="terms">
        <label>I Accept Terms and Conditions</label> <br> <br>


    </fieldset><br>
    </form>



    <center>

        <button type = "submit" id="submit"> Submit </button>
        <button type = "reset" id="reset"> Reset </button>

    </center>



</body>
</html>
