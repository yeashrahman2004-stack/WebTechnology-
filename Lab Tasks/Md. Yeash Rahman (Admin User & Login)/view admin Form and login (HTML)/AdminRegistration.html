
<!DOCTYPE html>
<html>

<head>
    <title>Admin Registration Form</title>

    <link rel="stylesheet" href="../CSS/AdminRegistration.css">
</head>

<body>

    <header>
        <center>
            <img src="../images/admin.jpg"
                 alt="Admin Profile" width="150">
        </center>

        <h1>Admin Information</h1>
    </header>

    <form method="GET" class="form-box"
          id="adminForm" novalidate>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label><br>
            <input type="text" name="name" id="name"
                   placeholder="Enter your Name">
            <p class="error" id="nameError"></p>
            <br>

            <label for="email">Email:</label><br>
            <input type="text" name="email" id="email"
                   placeholder="Enter your Email">
            <p class="error" id="emailError"></p>
            <br>

            <label for="phone">Phone:</label><br>
            <input type="tel" name="phone" id="phone"
                   placeholder="Enter your Phone Number">
            <p class="error" id="phoneError"></p>
            <br>

            <label for="age">Age:</label><br>
            <input type="number" name="age" id="age"
                   placeholder="Enter your Age">
            <p class="error" id="ageError"></p>
            <br>

            <label>Gender:</label>

            <input type="radio" name="gender" id="male" value="Male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female" value="Female">
            <label for="female">Female</label>

            <p class="error" id="genderError"></p>

        </fieldset>

        <br>

        <fieldset>
            <legend>University Information</legend>
            <br>

            <label for="uni_id">University ID:</label><br>
            <input type="text" name="uni_id" id="uni_id"
                   placeholder="Enter your 4 digit university id">
            <p class="error" id="uniIdError"></p>
            <br>

            <label for="dept">Department:</label>

            <select name="dept" id="dept">
                <option value="">Select</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="LAW">LAW</option>
            </select>
            <p class="error" id="deptError"></p>

            <br>

            <label for="role">Role:</label>

            <select name="role" id="role">
                <option value="">Select</option>
                <option value="Student">Student</option>
                <option value="Faculty">Faculty</option>
                <option value="Authority">Authority</option>
            </select>
            <p class="error" id="roleError"></p>

            <br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Account Information</legend>
            <br>

            <label for="password">Password:</label><br>
            <input type="password" name="password" id="password"
                   placeholder="Minimum 6 Characters">
            <p class="error" id="passwordError"></p>
            <br>

            <label for="confirm_password">Confirm Password:</label><br>
            <input type="password" name="confirm_password"
                   id="confirm_password"
                   placeholder="Re-enter password">
            <p class="error" id="confirmPasswordError"></p>
            <br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Admin Verification</legend>
            <br>

            <label for="admin_id">Admin ID:</label><br>
            <input type="text" name="admin_id" id="admin_id"
                   placeholder="Enter your 4 digit admin id">
            <p class="error" id="adminIdError"></p>
            <br>

            <input type="checkbox" id="terms" name="terms">
            <label for="terms">I Accept Terms and Conditions</label>
            <p class="error" id="termsError"></p>

            <br>

        </fieldset>

        <br>

        <center>
            <button type="submit" id="submit">Submit</button>
            <button type="reset" id="reset">Reset</button>

            <p id="formMessage"></p>
        </center>


            <script src="../JavaScript/AdminRegistration.js"></script>


    </form>

</body>
</html>
