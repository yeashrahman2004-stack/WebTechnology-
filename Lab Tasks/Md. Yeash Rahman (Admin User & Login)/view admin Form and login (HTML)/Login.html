
<!DOCTYPE html>
<html>

<head>
    <title>CampusHub</title>

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <center>
        <img src="../images/22.png" alt="CampusHub Logo" width="400">
        <br><br>

        <h4>Welcome!</h4>
        <h4>Please Login to Your Account</h4>
    </center>

    <form method="post" id="loginForm" novalidate>

        <center>

            <label for="username">Username or Email:</label>
            <br><br>

            <input type="text" id="username" name="username"
                   class="input-box"
                   placeholder="Enter your username or email">

            <p class="error" id="usernameError"></p>

            <br>

            <label for="password">Password:</label>
            <br><br>

            <input type="password" id="password" name="password"
                   class="input-box"
                   placeholder="Enter your password">

            <p class="error" id="passwordError"></p>

            <br>

            <label for="userCategory">Select User Category:</label>
            <br><br>

            <select id="userCategory" name="userCategory"
                    class="input-box">

                <option value="">-- Select Category --</option>
                <option value="Admin">Admin</option>
                <option value="Customer">Customer</option>
                <option value="Manager">Manager</option>
                <option value="Seller">Seller</option>

            </select>

            <p class="error" id="categoryError"></p>

            <br>

            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember Me</label>

        </center>

        <center>
            <button type="submit" id="login">Login</button>
        </center>

        <br>

        <center>

            <p id="loginMessage"></p>

            <p>Forgot Your Password?</p>
            <a href="forgot-password.html">Reset Password</a>

            <p>Don't Have an Account?</p>
            <a href="registration.html">Register Now</a>

        </center>

            <script src="../JavaScript/login.js"></script>


    </form>

    <br>

</body>
</html>
