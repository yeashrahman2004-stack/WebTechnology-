<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../studentCSS/studentregistrationstyle.css">
    </head>
    <body>
        <div class="backimg">
        <img src="file:///e:/12th Semester (Fall)/Web Technologies/WebProject/student/WebPicture/Student/studentregistration.jpg" alt="Registration Form" width="600" height="780">
        <div class="registrationicon">
            <img src="file:///e:/12th Semester (Fall)/Web Technologies/WebProject/student/WebPicture/Student/student-registration-icon3.jpg" alt="Registration Icon" width="200" height="170">
        </div>
  <div>
  <form method="post" action="studentregistrationsubmit.html" onsubmit="return registrationvalidateForm()">
 
  <label for="name" class="fullname"><b>Full Name:</b></label>
  <input type="text" id="name" name="name" class="fullnamearea" onkeyup="nameCheck()"><p id="errorname"></p><br><br>
  <label for="phonenumber" class="phonenum"><b>Phone Number:</b></label>
  <input type="tel" id="phonenumber" name="phonenumber" class="phonenumarea" onkeyup="phoneCheck()"><p id="errornum"></p><br><br>
  <label for="email" class="emailadd"><b>Email Address:</b></label>
  <input type="email" id="email" name="email" class="emailaddarea" onkeyup="emailCheck()"><p id="errormail"></p><br><br>
  <label for="address" class="homeadd"><b>Home Address:</b></label>
  <input type="text" id="address" name="homeadd" class="homeaddarea"><br><br>
  <label for="bloodtype" class="bloodtypeofstudent"><b>Blood Type:</b></label>
  <input type="text" id="bloodtype" name="bloodtype" class="bloodtypeofstudentarea">
  <label for="dob" class="dateofbirth"><b>DOB:</b></label>
  <input type="date" id="dob" name="dob" class="dateofbirtharea"><br><br>
  <label for="gender" class="gendername"><b>Gender:</b></label><br>
  <input type="radio" id="gender" name="gender" value="Male" class="gendermale">
  <label for="male" class="gendermalearea">Male</label>
  <input type="radio" id="female" name="gender" value="Female" class="genderfemale">
  <label for="female" class="genderfemalearea">Female</label>
  <input type="radio" id="other" name="gender" value="Other" class="genderother">
  <label for="other" class="genderotherarea">Other</label><br><br>
  <label for="clubs" class="chooseclubs"><b>Choose a club:</b></label>
  <select id="clubs" class="chooseclubsarea"> 
   <option value="artsnddesignclub">Art and Design Club</option>
   <option value="culturalclub">Cultural Club</option>
   <option value="photographyclub">Photography Club</option> 
   <option value="socialwelfareclub">Social Welfare Club</option>
   <option value="environmentclub">Environment Club</option>
   <option value="computerscienceclub">Computer Science Club</option>
   <option value="roboticsclub">Robotics Club</option>
   <option value="artificialintelligenceclub">Artificial Intelligence Club</option>
   <option value="researchclub">Research Club</option>
   <option value="mathematicsclub">Mathematics Club</option>
   <option value="cricketclub">Cricket Club</option>
   <option value="footballclub">Football Club</option>
   <option value="badmintonclub">Badminton Club</option>
   <option value="basketballclub">Basketball Club</option>
   <option value="chessclub">Chess Club</option>
  </select><br><br>
  <label for="passward" class="choosenpassward"><b>Passward:</b></label>
  <input type="text" id="passward" name="passward" class="choosenpasswardarea" onkeyup="passCheck()"><p id="errorpass"></p><br><br>
  <label for="confirmedpassward" class="confirmedpasswardname"><b>Confirmed Passward:</b></label>
  <input type="text" id="confirmedpassward" name="confirmedpassward" class="confirmedpasswardnamearea" onkeyup="conpassCheck()"><p id="errorconpass"></p><br><br>
  <input type="submit" value="Submit" class="submitarea"><br><br>
  <input type="reset" value="Clear" class="cleararea">

</form>
</div>
</div>
<script src="../studentjs/studentregistration.js"></script>
</body>
</html>
